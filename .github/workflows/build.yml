name: Build MeshChat

# Builds only when a version tag is pushed (e.g. `git tag v1.0.0 && git push
# origin v1.0.0`), or when run by hand from the Actions tab. Ordinary commits
# and pull requests do not trigger a build.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      # v1.2.3 -> 1.2.3 (a "-beta" style suffix is dropped, since the app's
      # version string must be plain numbers). Manual runs fall back to 1.0.
      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
            V="${V%%-*}"
          else
            V="1.0"
          fi
          echo "value=$V" >> "$GITHUB_OUTPUT"
          echo "Building version $V"

      # CODE_SIGNING_ALLOWED=NO skips code signing entirely — CI runners
      # don't have your Apple Developer certificate/team installed, and
      # don't need one just to produce a build. The resulting .app is
      # unsigned (see the ad-hoc step below), so on the receiving Mac it needs
      # the same Gatekeeper bypass as any other unsigned app (install.sh, or
      # `xattr -cr MeshChat.app`).
      - name: Build for macOS
        run: |
          xcodebuild build \
            -project MeshChat.xcodeproj \
            -scheme MeshChat \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            MARKETING_VERSION="${{ steps.version.outputs.value }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      # Ad-hoc signature ("-" identity, no certificate or paid account
      # needed). Apple silicon refuses to launch a binary with no valid
      # signature at all, and the embedded WebRTC framework needs to be
      # signed consistently with the app. This does NOT make Gatekeeper
      # trust the app — install.sh / `xattr -cr` still handles that — it
      # just keeps the unsigned build launchable.
      - name: Ad-hoc sign the app
        run: |
          codesign --force --deep --sign - build/Build/Products/Release/MeshChat.app
          codesign --verify --deep --verbose=2 build/Build/Products/Release/MeshChat.app || true

      - name: Zip the app
        run: |
          cd build/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent MeshChat.app MeshChat-macOS.zip

      # Kept for manual runs (no release is created for those).
      - name: Upload macOS build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeshChat-macOS
          path: build/Build/Products/Release/MeshChat-macOS.zip
          retention-days: 14

      # A real, versioned GitHub Release for the pushed tag. Release assets
      # are public, unauthenticated URLs, which is what lets install.sh fetch
      # `releases/latest/download/MeshChat-macOS.zip` with plain curl.
      # Tags containing "-" (v1.2.0-beta) are published as pre-releases and
      # are not picked up as "latest".
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: MeshChat ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          body: |
            macOS 14+ (Apple silicon and Intel). Not notarized (no paid Apple account).

            **Install (recommended):**
            ```
            curl -fsSL https://raw.githubusercontent.com/parth0072/p2pchat/main/install.sh | bash
            ```

            **Or manually:** download `MeshChat-macOS.zip`, unzip it, run `xattr -cr MeshChat.app`, then open it. (Or open it once and use System Settings > Privacy & Security > Open Anyway.)
          files: build/Build/Products/Release/MeshChat-macOS.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
