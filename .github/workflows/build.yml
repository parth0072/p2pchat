name: Build MeshChat

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-macos:
    name: Build (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      # CODE_SIGNING_ALLOWED=NO skips code signing entirely — CI runners
      # don't have your Apple Developer certificate/team installed, and
      # don't need one just to verify the app compiles.
      - name: Build for macOS
        run: |
          xcodebuild build \
            -project MeshChat.xcodeproj \
            -scheme MeshChat \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

  build-ios:
    name: Build (iOS Simulator)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -project MeshChat.xcodeproj \
            -scheme MeshChat \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
