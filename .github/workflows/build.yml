name: Build MeshChat

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      # CODE_SIGNING_ALLOWED=NO skips code signing entirely — CI runners
      # don't have your Apple Developer certificate/team installed, and
      # don't need one just to produce a build. The resulting .app is
      # unsigned, so on the receiving Mac it needs the same Gatekeeper
      # bypass as any other unsigned/ad-hoc app (right-click > Open, or
      # `xattr -cr MeshChat.app`).
      - name: Build for macOS
        run: |
          xcodebuild build \
            -project MeshChat.xcodeproj \
            -scheme MeshChat \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      # Ad-hoc signature ("-" identity, no certificate or paid account
      # needed). Apple silicon refuses to launch a binary with no valid
      # signature at all, and the embedded WebRTC framework needs to be
      # signed consistently with the app. This does NOT make Gatekeeper
      # trust the app — install.sh / `xattr -cr` still handles that — it
      # just keeps the unsigned build launchable.
      - name: Ad-hoc sign the app
        run: |
          codesign --force --deep --sign - build/Build/Products/Release/MeshChat.app
          codesign --verify --deep --verbose=2 build/Build/Products/Release/MeshChat.app || true

      - name: Zip the app
        run: |
          cd build/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent MeshChat.app MeshChat-macOS.zip

      - name: Upload macOS build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeshChat-macOS
          path: build/Build/Products/Release/MeshChat-macOS.zip
          retention-days: 14

      # Actions artifacts (above) require a logged-in GitHub session to
      # download, so they don't work from a plain `curl` install script.
      # Publishing to a rolling "latest" Release instead makes the zip a
      # public, unauthenticated URL that install.sh can fetch directly.
      # Only do this on actual pushes to main, not on PR builds.
      - name: Publish/update "latest" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest macOS build
          body: |
            Automated macOS build from commit ${{ github.sha }} (macOS 14+, Apple silicon and Intel).

            **Install (recommended):**
            ```
            curl -fsSL https://raw.githubusercontent.com/parth0072/p2pchat/main/install.sh | bash
            ```

            **Or manually:** download `MeshChat-macOS.zip`, unzip it, then run `xattr -cr MeshChat.app` and open it. The app is not notarized (no paid Apple account), so macOS blocks a browser-downloaded copy until you do this — or use System Settings > Privacy & Security > Open Anyway.
          make_latest: true
          files: build/Build/Products/Release/MeshChat-macOS.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
